<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chhota Gaon · Tiny Living Village</title>
<style>
:root{--card:#33271b;--line:#4a3a29;--ink:#f3e7cf;--mute:#b8a27e;--accent:#e8923a;--gold:#f2b632;--paper:#f6ead0;--pink:#3b2a1a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at 30% 0%,#33261a,#17110b 70%);color:var(--ink);font:14px system-ui,"Segoe UI",sans-serif}
#app{display:grid;grid-template-columns:minmax(0,1fr) 370px;grid-template-rows:auto minmax(0,1fr);gap:12px 14px;height:100vh;padding:10px 14px 12px}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:700 20px Georgia,serif;letter-spacing:.3px;display:block}
.brand small{color:var(--mute);font-size:11.5px}
.logo{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff6cf 0 14%,#f2b632 22%,#e8923a 46%,#8a4029 70%,transparent 73%);box-shadow:0 0 22px #e8923a99;animation:flick 2.6s ease-in-out infinite}
@keyframes flick{50%{box-shadow:0 0 14px #e8923a66}}
.clockbox{min-width:210px}
#clock{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:700 15px Georgia,serif}
#clock span{color:var(--mute);font:500 12px system-ui}
.dayline{position:relative;height:6px;border-radius:3px;margin-top:6px;background:linear-gradient(90deg,#1d2748 0 22%,#e8923a 27%,#f6d77a 36%,#f8eab0 50%,#f6d77a 66%,#e8923a 76%,#1d2748 84% 100%)}
#sun{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff6cf;box-shadow:0 0 10px #f2b632;transform:translate(-50%,-50%)}
.seg{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
button{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:7px;padding:5px 10px;cursor:pointer;transition:background .15s,color .15s,transform .1s}
button:hover{background:#ffffff16}
button:active{transform:scale(.96)}
button.on{background:var(--accent);color:#21180f;font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
input{font:inherit;color:var(--ink);background:transparent;border:0;width:92px;padding:5px 6px}
#left{min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px}
#stage{position:relative;width:min(100%,calc((100vh - 175px) * 16 / 9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px #000a,0 0 0 1px #5a4630}
#view{width:100%;height:100%;display:block;image-rendering:pixelated}
#view.hand{cursor:pointer}
#labels{position:absolute;inset:0;pointer-events:none}
#labels span{position:absolute;transform:translate(-50%,-100%);font:650 10px system-ui;color:#fff8e8;text-shadow:0 1px 2px #000d,0 0 5px #0009;white-space:nowrap;text-align:center;line-height:1.15;transition:opacity .25s}
#labels span small{display:block;font-weight:500;font-size:9.5px;color:#ffe2a8}
#labels span.sel{color:var(--gold)}
#labels span.hide{opacity:0}
#pill{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#21180fcc;border:1px solid #6a5238;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--gold);display:none;backdrop-filter:blur(3px)}
#chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:100%}
#chips button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px 10px 2px 3px;display:flex;align-items:center;gap:6px;font-size:12px}
#chips button.sel{border-color:var(--gold);background:#4a3720}
#chips button small{color:var(--mute);font-size:10.5px}
.av{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font:700 10px system-ui;color:#fff;flex:none;text-shadow:0 1px 1px #0006}
.keys{color:var(--mute);font-size:11px;text-align:center}
.keys kbd{background:var(--card);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font:11px system-ui;color:var(--ink)}
#side{min-height:0;display:flex;flex-direction:column;gap:12px;overflow:auto;padding-right:2px}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 9px}
.stat b{display:block;font:700 17px Georgia,serif}
.stat span{color:var(--mute);font-size:10px;text-transform:uppercase;letter-spacing:.6px}
#panel{background:var(--paper);color:var(--pink);border-radius:14px;box-shadow:0 10px 30px #0008;overflow:hidden;flex:none}
#panel.pop{animation:pop .28s ease}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;gap:11px;padding:13px 14px 9px}
.ph .av{width:42px;height:42px;font-size:19px;box-shadow:inset 0 -3px 0 #0003,0 2px 6px #0003}
.ph h2{margin:0;font:700 19px Georgia,serif}
.ph .sub{color:#7a5f3f;font-size:12px}
.ph .x{margin-left:auto;align-self:flex-start;color:#7a5f3f;font-size:20px;line-height:1;padding:2px 8px}
.ph .x:hover{background:#00000010}
.chipt{display:inline-block;background:#ead7b0;border-radius:999px;padding:1px 8px;margin:3px 3px 0 0;font-size:11px;color:#5a4128}
.tabs{display:flex;gap:3px;padding:0 12px;border-bottom:1px solid #dcc79f}
.tabs button{color:#7a5f3f;border-radius:8px 8px 0 0;padding:6px 12px;font-weight:650}
.tabs button:hover{background:#00000008}
.tabs button.on{background:#ead7b0;color:#3b2a1a}
.tb{padding:10px 14px 14px;font-size:12.5px;line-height:1.45;max-height:50vh;overflow:auto}
.act{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-style:italic}
.dot{width:8px;height:8px;border-radius:50%;flex:none;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.meter{display:grid;grid-template-columns:68px 1fr 28px;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.meter .bar{height:8px;background:#e3cfa6;border-radius:4px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:4px;transition:width .5s ease}
.meter em{font-style:normal;color:#7a5f3f;text-align:right;font-variant-numeric:tabular-nums}
.inv{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 4px}
.inv span{background:#ead7b0;border-radius:6px;padding:2px 8px;font-size:11.5px}
.routine{color:#6a5034;font-size:11.5px;margin-top:4px}
.tb h4{margin:12px 0 4px;font:700 13px Georgia,serif;color:#5a4128}
.mem{padding:5px 0;border-top:1px dashed #d4bd90}
.mem small{color:#8a6f4a;display:block;font-size:10.5px}
.feel{display:grid;grid-template-columns:64px 1fr;gap:2px 9px;padding:6px 4px;border-top:1px solid #e3cfa6;cursor:pointer;border-radius:6px}
.feel:hover{background:#efdfbd}
.feel .nm{font-weight:700}
.fbar{position:relative;height:7px;background:#e3cfa6;border-radius:4px;align-self:center}
.fbar::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:#b89c66}
.fbar i{position:absolute;top:0;bottom:0;border-radius:4px;transition:width .5s}
.feel .why{grid-column:2;color:#7a5f3f;font-size:11px}
.badge{background:#c2453a;color:#fff;border-radius:4px;padding:0 5px;font-size:10px;margin-left:4px}
.entry{background:#fbf3e1;border-radius:10px;padding:9px 11px;margin:7px 0;box-shadow:0 1px 0 #d9c49a}
.entry b{font-family:Georgia,serif;color:#8a4029;display:block;margin-bottom:2px}
.hint{color:#8a6f4a;font-style:italic}
.welcome{padding:15px 17px;font-size:13px;line-height:1.55}
.welcome h2{margin:0 0 4px;font:700 18px Georgia,serif}
.welcome ul{padding-left:18px;margin:8px 0 0}
#feedBox{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;flex:1 0 230px;min-height:230px;display:flex;flex-direction:column}
.fh{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.fh h3{margin:0;font:700 14px Georgia,serif;color:var(--gold)}
.filters{display:flex;gap:3px}
.filters button{font-size:11px;padding:3px 8px;background:#ffffff0d}
.filters button.on{background:var(--accent)}
#feed{overflow:auto;flex:1}
#feed>div{padding:6px 8px 6px 10px;border-left:3px solid #6a5238;margin:4px 0;border-radius:4px;background:#ffffff07;cursor:pointer;animation:fin .45s ease;font-size:12px;line-height:1.38}
#feed>div:hover{background:#ffffff14}
@keyframes fin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
#feed .t{color:var(--mute);font-size:10.5px;display:block}
#feed .c-rumor{border-color:#6fb4d6}#feed .c-conflict{border-color:#d66a5a}#feed .c-kind{border-color:#8fc27a}
#feed[data-f="rumor"]>div:not(.c-rumor),#feed[data-f="conflict"]>div:not(.c-conflict),#feed[data-f="kind"]>div:not(.c-kind){display:none}
#feed>div.empty{border:0;background:none;cursor:default;color:var(--mute);font-style:italic;display:block!important}
@media (max-width:900px){
  #app{display:flex;flex-direction:column;height:auto;min-height:100vh;width:100%;overflow-x:hidden}
  .brand{margin-right:0;flex:1 1 100%}
  #stage{width:100%}
  #side{overflow:visible}
  #feedBox{max-height:380px}
  .tb{max-height:none}
  #stats{grid-template-columns:repeat(2,1fr)}
  .keys{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo"></span><div><b>Chhota Gaon</b><small>a tiny living village</small></div></div>
    <div class="clockbox"><div id="clock">Day 1</div><div class="dayline"><i id="sun"></i></div></div>
    <div class="seg"><button id="pause" title="Pause / resume (Space)">❚❚</button><button data-sp="1" class="on">1×</button><button data-sp="2">2×</button><button data-sp="4">4×</button><button data-sp="8">8×</button></div>
    <div class="seg"><button id="names" class="on" title="Show names (N)">Names</button></div>
    <div class="seg"><input id="seed" value="emberfall" aria-label="Village seed" title="Village seed: same seed, same story"><button id="restart" title="Restart this village (R)">↻</button><button id="random" title="A brand-new village">⚄</button></div>
  </header>
  <div id="left">
    <div id="stage"><canvas id="view" width="480" height="270" aria-label="The village, seen from above"></canvas><div id="labels"></div><div id="pill">Paused · press Space</div></div>
    <div id="chips"></div>
    <div class="keys"><kbd>Space</kbd> pause · <kbd>1</kbd>–<kbd>4</kbd> speed · <kbd>N</kbd> names · <kbd>[</kbd> <kbd>]</kbd> next villager · <kbd>Esc</kbd> close</div>
  </div>
  <div id="side">
    <div id="stats">
      <div class="stat"><b id="stMood">–</b><span>Mood</span></div>
      <div class="stat"><b id="stFeud">0</b><span>Feuds</span></div>
      <div class="stat"><b id="stRumor">0</b><span>Rumors</span></div>
      <div class="stat"><b id="stTrade">0</b><span>Trades today</span></div>
    </div>
    <div id="panel"></div>
    <div id="feedBox">
      <div class="fh"><h3>Village feed</h3><div class="filters"><button data-f="all" class="on">All</button><button data-f="rumor">Rumors</button><button data-f="conflict">Conflict</button><button data-f="kind">Kindness</button></div></div>
      <div id="feed" data-f="all"></div>
    </div>
  </div>
</div>

<script id="sim">
/* ===================== WORLD: constants, palette, layout ===================== */
const C={grass:'#8fae6a',grassLt:'#a6c27c',grassDk:'#7b9b58',path:'#dcc394',pathDk:'#c6a871',
  water:'#6fa3a8',waterLt:'#a5d0cc',wood:'#8b5e3c',woodDk:'#63402a',roof:'#b5583f',roofDk:'#8a4029',
  roof2:'#b98a4e',wall:'#f2dfb8',wallDk:'#d9bd8e',stone:'#c2b8a3',stoneDk:'#9d9482',leaf:'#5f8a4c',
  leafLt:'#86ad6b',leafDk:'#43693a',trunk:'#7a5536',wheat:'#e2c662',wheatDk:'#c29d3f',awnR:'#c4455f',
  awnC:'#f2b632',window:'#ffd98a',night:'#1d2748',shade:'rgba(52,36,20,0.22)',skin1:'#f3cba4',
  skin2:'#c48a5e',hair1:'#4a2e1d',hair2:'#d9a441',hair3:'#2e2b2a',hair4:'#a0522d',cloth1:'#c4455f',
  cloth2:'#2f7f86',cloth3:'#e8923a',cloth4:'#7a3f8f',legs:'#4b3a2c',bubble:'#fff6e3',ink:'#3b2a1a',
  gold:'#e8b84a',red:'#c2453a',heart:'#e0607a',paper:'#f1e2bd',marigold:'#f2b632',lotus:'#e87aa0',saffron:'#e8923a',temple:'#e9d2a8'};
const TPD=720, MPT=2, DAY0=360;              // 720 ticks/day, 2 sim-minutes/tick, day starts 06:00
const W=480, H=270;
const BASE={grain:2,bread:8,fish:4,meal:14};
const SURPLUS={grain:8,fish:8,bread:3,meal:3};   // stock above this is carried to the market // reference prices
const MARKET_PAY=0.8, WAGE=6;                 // market buys surplus at 80% base; daily village-purse wage
const FOOD=[['meal',45],['bread',35],['fish',30],['grain',12]];   // raw grain is a poor last resort
const HUB={well:[236,150],market:[168,146],tavern:[322,134]};
const HUBS=[HUB.well,HUB.market,HUB.tavern], HUBNAME=['the well','the bazaar','the chai house'];
const POND={x:398,y:210,rx:24,ry:13};
const MILL=[286,208];
const FIELDS=[[34,168,72,44],[34,96,64,40]];  // x,y,w,h
const HOUSES=[[170,74],[206,74],[242,74],[278,74],[314,74],[350,74],[386,74],[150,240],[190,240],[230,240],[134,190],[354,190]];
const NAMES=['Aarav','Meera','Ishaan','Priya','Kabir','Anjali','Rohan','Sita','Vikram','Lakshmi','Arjun','Devika'];
const ITEM={grain:'wheat',bread:'roti',fish:'fish',meal:'thali'};
const JOBNAME={farmer:'farmer',baker:'roti-maker',fisher:'fisher',innkeeper:'chai-wallah'};
const TEMPLE=[120,126];
const JOBS=['farmer','farmer','farmer','farmer','baker','baker','baker','fisher','fisher','fisher','innkeeper','innkeeper'];
const TRAITS=['generous','proud','gossipy','forgiving','greedy'];
const HAIR=[C.hair1,C.hair2,C.hair3,C.hair4], CLOTH=[C.cloth1,C.cloth2,C.cloth3,C.cloth4], SKIN=[C.skin1,C.skin2];
const KIND={cheat:'overcharged',rude:'insulted',kind:'helped'};
const BANYAN=[198,118];
/* Personal pastimes: each villager gets their own dawn, afternoon and evening routine (see createSim). */
const PASTIMES={
  prayer:{label:'praying at the temple',short:'praying',dur:30,at:(v,R)=>[TEMPLE[0]+R()*10-5,TEMPLE[1]+9+R()*4],diary:['I said my prayers at the temple','I lit a diya at the temple']},
  water:{label:'fetching water at the well',short:'fetching water',dur:24,at:(v,R)=>[HUB.well[0]+R()*14-7,HUB.well[1]+6+R()*4],diary:['I fetched water from the well','I carried a pot of water home from the well']},
  rangoli:{label:'drawing rangoli at the doorstep',short:'rangoli',dur:30,solo:1,at:v=>[v.hx+4,v.hy+7],diary:['I drew a fresh rangoli at my door','I redid the rangoli at my doorstep']},
  yoga:{label:'doing yoga at sunrise',short:'yoga',dur:36,at:(v,R)=>[134+R()*10,142+R()*6],diary:['I did my yoga as the sun came up','I stretched and breathed by the temple at dawn']},
  chai:{label:'sipping chai at the chai house',short:'chai',dur:30,at:(v,R)=>[HUB.tavern[0]+R()*20-10,HUB.tavern[1]+9+R()*6],diary:['I had a cup of chai at the chai house','I sat over a glass of cutting chai']},
  cards:{label:'playing cards at the chai house',short:'cards',dur:50,at:(v,R)=>[HUB.tavern[0]-16+R()*8,HUB.tavern[1]+11+R()*4],diary:['I played cards at the chai house','We played a long game of cards at the chai house']},
  aarti:{label:'joining the evening aarti',short:'aarti',dur:34,at:(v,R)=>[TEMPLE[0]+R()*14-7,TEMPLE[1]+9+R()*5],diary:['I joined the evening aarti at the temple','I sang at the evening aarti']},
  washing:{label:'washing clothes at the pond',short:'washing',dur:40,at:(v,R)=>[POND.x-8+R()*14,POND.y-POND.ry-3],diary:['I washed clothes at the pond','I beat the laundry clean on the pond stones']},
  stroll:{label:'taking a stroll through the lanes',short:'strolling',dur:20,at:(v,R)=>{const p=choose(R,RN);return [p[0],p[1]];},diary:['I took a slow walk around the village','I walked the lanes as the lamps came on']},
  nap:{label:'napping through the afternoon heat',short:'napping',dur:60,solo:1,at:v=>[v.hx,v.hy+4],diary:['I napped through the afternoon heat','I slept off the afternoon sun']},
  banyan:{label:'resting under the banyan tree',short:'banyan shade',dur:45,at:(v,R)=>[BANYAN[0]+R()*18-9,BANYAN[1]+7+R()*5],diary:['I sat in the shade of the banyan tree','I rested on the platform under the banyan']},
  bazaar:{label:'browsing the bazaar stalls',short:'browsing',dur:30,at:(v,R)=>[HUB.market[0]+R()*16-8,HUB.market[1]+6+R()*5],diary:['I wandered through the bazaar','I haggled over trinkets at the bazaar']}
};
const ROUTINE_OPTS={dawn:['prayer','water','rangoli','yoga'],afternoon:['nap','banyan','bazaar','washing'],evening:['chai','cards','aarti','stroll','washing','banyan']};
const listNames=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const DETAILS=['in front of everyone','twice','with a sneer','and never paid it back','at the bazaar','while the other went hungry','and laughed about it'];

/* ===================== UTILITIES ===================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;s=String(s);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const dist=(ax,ay,bx,by)=>Math.hypot(ax-bx,ay-by);
const choose=(R,a)=>a[Math.floor(R()*a.length)];
function shuffle(a,R){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
const minuteOf=t=>(t*MPT+DAY0)%1440;
const dayOf=t=>Math.floor((t*MPT+DAY0)/1440)+1;
const isNight=m=>m>=1320||m<360;
const isWorkHours=m=>m>=390&&m<1200;
const mood=v=>{const n=v.need;return clamp(100-(n.hunger*0.4+n.fatigue*0.3+n.social*0.3),0,100);};
const moodWord=m=>m>65?'content':m>45?'fine':m>25?'tired':'miserable';
const feelWord=s=>s>=60?'adores':s>=25?'likes':s>-25?'is neutral toward':s>-50?'distrusts':'feuds with';

/* ===================== WORLD: street network (villagers follow roads between places) ===================== */
const RN=[[236,150],[150,84],[236,84],[322,84],[400,84],[168,150],[322,150],[236,200],[286,218],[366,212],
  [120,150],[110,190],[104,118],[236,250],[150,250],[354,202],[120,134]];
const RE=[[1,10],[1,2],[2,3],[3,4],[2,0],[1,5],[0,5],[5,10],[10,16],[16,12],[10,11],[0,6],[0,7],[7,8],[8,9],
  [7,13],[13,14],[14,11],[6,15],[15,9],[4,15]];
const RD=RN.map((_,i)=>RN.map((_,j)=>i===j?0:Infinity)), RNX=RN.map(()=>RN.map((_,j)=>j));
for(const [a,b] of RE){RD[a][b]=RD[b][a]=dist(RN[a][0],RN[a][1],RN[b][0],RN[b][1]);}
for(let k=0;k<RN.length;k++)for(let i=0;i<RN.length;i++)for(let j=0;j<RN.length;j++)
  if(RD[i][k]+RD[k][j]<RD[i][j]){RD[i][j]=RD[i][k]+RD[k][j];RNX[i][j]=RNX[i][k];}
function nearestOnRoad(x,y){
  let best=null;
  for(const [a,b] of RE){
    const [ax,ay]=RN[a],[bx,by]=RN[b],dx=bx-ax,dy=by-ay;
    const t=clamp(((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy),0,1), px=ax+dx*t, py=ay+dy*t, d=dist(x,y,px,py);
    if(!best||d<best.d) best={a,b,p:[px,py],d};
  }
  return best;
}
function route(x,y,tx,ty){                       // waypoints: onto the nearest street, along it, off to the target
  if(dist(x,y,tx,ty)<36) return [];
  const A=nearestOnRoad(x,y), B=nearestOnRoad(tx,ty);
  if((A.a===B.a&&A.b===B.b)||(A.a===B.b&&A.b===B.a)) return [A.p,B.p];
  let best=null,bd=Infinity;
  for(const i of [A.a,A.b]) for(const j of [B.a,B.b]){
    const d=dist(A.p[0],A.p[1],RN[i][0],RN[i][1])+RD[i][j]+dist(RN[j][0],RN[j][1],B.p[0],B.p[1]);
    if(d<bd){bd=d;best=[i,j];}
  }
  const path=[A.p]; let i=best[0]; path.push(RN[i]);
  while(i!==best[1]){i=RNX[i][best[1]];path.push(RN[i]);}
  path.push(B.p); return path;
}

/* ===================== AGENTS: creation ===================== */
function createSim(seed){
  const S={seed:String(seed),rng:mulberry(hashStr(seed)),tick:0,day:1,log:[],rumors:{},rumorN:0,market:{grain:0,fish:0,bread:0,meal:0},v:[],
    stats:{made:{grain:0,bread:0,fish:0,meal:0},marketCoins:0,sold:0}};
  const R=S.rng, names=shuffle(NAMES,R);
  S.v=names.map((name,i)=>{
    const job=JOBS[i], h=HOUSES[i], f=FIELDS[i%2];
    const work=job==='farmer'?[f[0]+6+R()*(f[2]-12),f[1]+6+R()*(f[3]-12)]
      :job==='baker'?[MILL[0]+R()*8-4,MILL[1]+12]
      :job==='fisher'?[POND.x-POND.rx-3,POND.y+R()*6-3]
      :[HUB.tavern[0]+R()*6-3,HUB.tavern[1]+14];
    return {id:i,name,job,traits:shuffle(TRAITS,R).slice(0,R()<0.4?3:2),work,
      hair:choose(R,HAIR),cloth:choose(R,CLOTH),skin:choose(R,SKIN),hat:R()<0.5,
      hx:h[0],hy:h[1],x:h[0],y:h[1]+4,tx:h[0],ty:h[1]+4,speed:2.6+R()*0.6,
      act:'idle',actT:0,then:'idle',thenT:0,walkT:0,buy:null,buyFrom:-1,partner:-1,sess:0,
      need:{hunger:10+R()*20,fatigue:10+R()*15,social:20+R()*25},
      coins:12,inv:{grain:0,bread:0,fish:0,meal:0},
      op:Array.from({length:NAMES.length},(_,j)=>j===i?0:R()*6-3),   // opinion of each villager
      feud:[],mem:[],bel:{},lastTalk:{},walk:0,dir:1,icon:null,iconT:0,pastime:null,past:{}};
  });
  for(const v of S.v){                                     // personal routine, nudged by personality
    const ev=shuffle(ROUTINE_OPTS.evening,R).slice(0,2);
    if(v.traits.includes('gossipy')&&!ev.includes('chai')&&!ev.includes('cards')) ev[0]=R()<0.5?'chai':'cards';
    if(v.traits.includes('generous')&&!ev.includes('aarti')) ev[1]='aarti';
    v.routine={dawn:choose(R,ROUTINE_OPTS.dawn),afternoon:choose(R,ROUTINE_OPTS.afternoon),evening:ev[0]===ev[1]?[ev[0]]:ev};
  }
  return S;
}

/* ===================== SYSTEMS: event log, opinions, memory ===================== */
// The log is the only write path for history. State changes always go through emit()/shift()/remember().
const SPOTS=[['the well',HUB.well],['the bazaar',HUB.market],['the chai house',HUB.tavern],['the chakki',MILL],['the temple',TEMPLE],['the banyan tree',BANYAN],['the pond',[POND.x,POND.y]],
  ['the south fields',[70,190]],['the north fields',[66,116]],...HOUSES.map(h=>['the houses',[h[0],h[1]]])];
function placeName(v){
  if(!v) return 'the village';
  let best='the lanes',bd=34;
  for(const [n,p] of SPOTS){const d=dist(v.x,v.y,p[0],p[1]);if(d<bd){bd=d;best=n;}}
  return best;
}
function emit(S,type,a,b,d,icon){
  const ev={id:S.log.length,t:S.tick,day:dayOf(S.tick),m:minuteOf(S.tick),type,a,b,place:placeName(S.v[a]),d:d||{}};
  S.log.push(ev);
  if(icon) for(const i of [a,b]) if(i>=0){S.v[i].icon=icon;S.v[i].iconT=40;}
  return ev;
}
function remember(S,i,ev,w,role){
  const mem=S.v[i].mem; mem.push({ev:ev.id,w,role});
  if(mem.length>80){let k=0;for(let j=1;j<mem.length;j++) if(mem[j].w<mem[k].w) k=j; mem.splice(k,1);}   // bounded memory
}
function shift(S,a,b,d){
  if(a===b) return;
  const v=S.v[a]; v.op[b]=clamp(v.op[b]+d,-100,100);
  if(!v.feud[b]&&v.op[b]<=-50){v.feud[b]=true;const ev=emit(S,'feud',a,b,{},'angry');remember(S,a,ev,0.7,'feud');}
  else if(v.feud[b]&&v.op[b]>=-20){v.feud[b]=false;const ev=emit(S,'reconcile',a,b,{},'heart');remember(S,a,ev,0.7,'reconcile');}
}
function witnesses(S,ids,x,y,ev,w){
  const out=[];
  for(const v of S.v){
    if(ids.includes(v.id)||v.act==='sleep'||dist(v.x,v.y,x,y)>40) continue;
    remember(S,v.id,ev,w,'saw'); out.push(v.id);
  }
  return out;
}
function newRumor(S,ev,doer,target,kind,sev,det){
  const r={id:S.rumorN++,origin:ev.id,doer,target,kind,sev,det,n:1,versions:[{v:1,from:doer,to:null,doer,sev,det}]};
  S.rumors[r.id]=r; return r;
}
function knowRumor(S,i,r,p){S.v[i].bel[r.id]={v:1,p,sev:r.sev,doer:r.doer,det:[]};}

/* ===================== SYSTEMS: rumors ===================== */
// A teller passes a rumor they believe. Mutation depends on the teller's opinion of the target,
// their traits (proud/greedy shift blame, gossipy adds detail). Belief depends on trust in the teller.
function addDetail(det,R){const d=choose(R,DETAILS);if(!det.includes(d))det.push(d);}
function tellRumor(S,t,l){
  const R=S.rng, T=S.v[t], L=S.v[l];
  const ids=Object.keys(T.bel).map(Number).filter(k=>S.rumors[k]&&T.bel[k].p>0.35&&!L.bel[k]);   // only news the listener lacks
  if(!ids.length) return;
  const rid=choose(R,ids), b=T.bel[rid], r=S.rumors[rid];
  let sev=b.sev, doer=b.doer, det=b.det.slice(), mut=[];
  const tOp=T.op[r.target];
  if(tOp<-20&&R()<0.8){sev=clamp(sev+0.2+R()*0.15,0,1);mut.push('exaggerated');if(R()<0.5)addDetail(det,R);}
  else if(tOp>20&&R()<0.8){sev=clamp(sev-0.2,0.05,1);mut.push('softened');if(det.length&&R()<0.5)det.pop();}
  if(doer===t&&(T.traits.includes('proud')||T.traits.includes('greedy'))&&R()<0.5){
    const others=S.v.filter(o=>o.id!==t&&o.id!==r.target&&o.id!==l);
    if(others.length){doer=choose(R,others).id;mut.push('blame shifted');}
  }
  if(T.traits.includes('gossipy')&&R()<0.25) addDetail(det,R);
  det=det.slice(-3);
  const ver=++r.n;
  r.versions.push({v:ver,from:t,to:l,doer,sev:+sev.toFixed(2),det,mut});
  if(r.versions.length>30) r.versions.splice(1,1);           // keep origin + recent versions only
  const bad=r.kind!=='kind';
  const p=clamp(0.5+(L.op[t]/100)*0.4+(bad?-1:1)*(L.op[doer]/300),0.05,0.95);
  const believed=R()<p;
  const ev=emit(S,'rumor',t,l,{rid,v:ver,doer,target:r.target,kind:r.kind,sev:+sev.toFixed(2),det,mut,believed,
    ax:T.x,ay:T.y,bx:L.x,by:L.y},believed?'excl':null);
  remember(S,l,ev,0.35+sev*0.5,'heard');
  remember(S,t,ev,0.2,'told');
  L.bel[rid]={v:ver,p:believed?p:0.1,sev,doer,det};
  if(believed) shift(S,l,doer,bad?-Math.round(sev*12):Math.round(sev*6));
}

/* ===================== SYSTEMS: trade, gifts, conflict ===================== */
function trade(S,s,b,item,qty){
  const R=S.rng, Sv=S.v[s], B=S.v[b];
  if(Sv.inv[item]<1||B.coins<1) return false;
  const base=BASE[item];
  let mk=1.1+R()*0.2;
  if(Sv.traits.includes('greedy')) mk+=0.35+R()*0.25;
  if(Sv.traits.includes('generous')) mk-=0.2;
  if(Sv.inv[item]<=2) mk+=0.15;                       // scarcity raises the price
  const unit=Math.max(1,Math.round(base*mk));
  qty=Math.max(1,Math.min(qty||1,Sv.inv[item],Math.floor(B.coins/unit)));
  const price=unit*qty;
  if(B.coins<price) return false;
  const fair=mk<=1.35;
  const p=clamp(0.35+(B.need.hunger/100)*0.5+(B.op[s]/100)*0.4-Math.max(0,mk-1)*0.6,0.02,0.97);
  if(R()>p) return false;
  Sv.inv[item]-=qty; B.inv[item]+=qty; B.coins-=price; Sv.coins+=price;
  const ev=emit(S,'trade',s,b,{item,price,base:base*qty,qty,fair},fair?'coin':'angry');
  if(fair){shift(S,b,s,2);shift(S,s,b,1);remember(S,s,ev,0.25,'did');remember(S,b,ev,0.25,'target');}
  else{
    shift(S,b,s,-8);remember(S,s,ev,0.7,'did');remember(S,b,ev,0.9,'target');
    const seen=witnesses(S,[s,b],Sv.x,Sv.y,ev,0.35);
    if(R()<0.6){
      const r=newRumor(S,ev,s,b,'cheat',clamp((mk-1)/0.5,0.2,1),[]);
      knowRumor(S,s,r,0.9);knowRumor(S,b,r,0.9);seen.forEach(i=>knowRumor(S,i,r,0.9));
    }
  }
  return true;
}
function maybeGift(S,g,r){
  const G=S.v[g], Rv=S.v[r], R=S.rng;
  if(!G.traits.includes('generous')||Rv.need.hunger<60||FOOD.some(f=>Rv.inv[f[0]]>0)) return;
  const item=['fish','bread','meal'].find(k=>G.inv[k]>=2);
  if(!item||Rv.op[g]<-20) return;
  if(Rv.traits.includes('proud')&&Rv.op[g]<30&&R()<0.5) return;   // proud people refuse charity
  G.inv[item]--; Rv.inv[item]++;
  shift(S,r,g,8); shift(S,g,r,2);
  const ev=emit(S,'gift',g,r,{item},'heart');
  remember(S,g,ev,0.5,'did'); remember(S,r,ev,0.8,'target');
}
function insult(S,t,l){
  const T=S.v[t], L=S.v[l];
  shift(S,l,t,-10); shift(S,t,l,-3);
  const ev=emit(S,'insult',t,l,{},'angry');
  remember(S,t,ev,0.6,'did'); remember(S,l,ev,0.9,'target');
  const seen=witnesses(S,[t,l],(T.x+L.x)/2,(T.y+L.y)/2,ev,0.35);
  if(S.rng()<0.7){const r=newRumor(S,ev,t,l,'rude',0.55,[]);knowRumor(S,t,r,0.9);knowRumor(S,l,r,0.9);seen.forEach(i=>knowRumor(S,i,r,0.9));}
}
function recentInsultBy(S,x,y){
  return S.v[x].mem.some(m=>{const e=S.log[m.ev];return m.role==='did'&&e.type==='insult'&&e.b===y&&S.tick-e.t<2*TPD;});
}
function apologize(S,t,l){
  const R=S.rng, L=S.v[l];
  const accept=(L.op[t]>-60||L.traits.includes('forgiving'))&&R()<0.8;
  if(accept){shift(S,l,t,14);shift(S,t,l,8);} else shift(S,l,t,-2);
  const ev=emit(S,'apology',t,l,{accepted:accept},accept?'heart':null);
  remember(S,t,ev,0.6,'did'); remember(S,l,ev,0.6,'target');
}

/* ===================== AGENTS: talking ===================== */
function startTalk(S,a,b){
  for(const x of [a,b])                                  // remember what they were doing so they can resume after chatting
    x.resume=x.act==='walk'?(x.buyFrom>=0?null:{walk:1,tx:x.tx,ty:x.ty,then:x.then,thenT:x.thenT,pastime:x.pastime})
      :(['work','pastime','socialize','sell','shop'].includes(x.act)?{act:x.act,actT:x.actT,pastime:x.pastime}:null);
  a.act=b.act='talk'; a.partner=b.id; b.partner=a.id; a.actT=b.actT=12;
  a.lastTalk[b.id]=b.lastTalk[a.id]=S.tick;
}
function resolveTalk(S,a,b){
  const R=S.rng;
  for(const [s,k] of [[a,b],[b,a]]) if(k.buyFrom===s.id){const it=k.buy;k.buyFrom=-1;k.buy=null;trade(S,s.id,k.id,it,k.job==='baker'&&it==='grain'?10:k.job==='innkeeper'?6:1);}
  maybeGift(S,a.id,b.id); maybeGift(S,b.id,a.id);
  for(const [x,y] of [[a,b],[b,a]]){
    const touchy=x.traits.includes('proud')||x.traits.includes('greedy');
    const irritable=(x.need.hunger>70||x.need.fatigue>80)&&x.op[y.id]<8&&R()<0.06;   // hunger and exhaustion shorten tempers
    if(((x.op[y.id]<-8&&touchy&&R()<0.15)||irritable)) insult(S,x.id,y.id);
    else if(x.op[y.id]<-10&&(recentInsultBy(S,x.id,y.id)||(x.traits.includes('forgiving')&&x.feud[y.id]))&&R()<0.5) apologize(S,x.id,y.id);
  }
  for(const [t,l] of [[a,b],[b,a]]) if(R()<(t.traits.includes('gossipy')?0.7:0.4)) tellRumor(S,t.id,l.id);
  shift(S,a.id,b.id,1); shift(S,b.id,a.id,1);      // shared time slowly warms people up
  a.need.social=clamp(a.need.social-25,0,100); b.need.social=clamp(b.need.social-25,0,100);
}
const CAN_TALK={walk:1,work:1,socialize:1,idle:1,sell:1,pastime:1};
function pairing(S){
  const R=S.rng, vs=S.v;
  for(let i=0;i<vs.length;i++) for(let j=i+1;j<vs.length;j++){
    const a=vs[i], b=vs[j];
    if(!CAN_TALK[a.act]||!CAN_TALK[b.act]) continue;
    if(dist(a.x,a.y,b.x,b.y)>12) continue;
    if(a.feud[j]||b.feud[i]){                    // feuding pairs avoid each other, unless a forgiving one reaches out
      if(!(a.traits.includes('forgiving')||b.traits.includes('forgiving'))||S.tick-(a.lastTalk[j]||-999)<150||R()>0.05) continue;
      startTalk(S,a,b); continue;
    }
    const buying=a.buyFrom===j||b.buyFrom===i;
    if(!buying&&S.tick-(a.lastTalk[j]||-999)<50) continue;
    const p=buying?1:((a.act==='socialize'||a.act==='pastime')&&(b.act==='socialize'||b.act==='pastime')?0.15:0.03);
    if(R()<p) startTalk(S,a,b);
  }
}

/* ===================== AGENTS: jobs & economy ===================== */
function produce(S,v){
  const t=S.tick, inv=v.inv;
  let made=null;
  if(v.job==='farmer'&&t%12===0&&inv.grain<12) made='grain';
  else if(v.job==='baker'&&t%20===0&&inv.grain>=2&&inv.bread<12){inv.grain-=2;made='bread';}
  else if(v.job==='fisher'&&t%30===0&&inv.fish<12) made='fish';
  else if(v.job==='innkeeper'&&t%30===0&&inv.grain>=2&&inv.fish>=1&&inv.meal<10){inv.grain-=2;inv.fish--;made='meal';}   // stew: grain + fish
  if(made){inv[made]++;S.stats.made[made]++;v.sess++;}
}
function sellSurplus(S,v){
  for(const it of ['grain','fish','bread','meal']) if(v.inv[it]>SURPLUS[it]){
    v.inv[it]--; const p=Math.max(1,Math.round(BASE[it]*MARKET_PAY));
    v.coins+=p; S.stats.marketCoins+=p; S.stats.sold++; S.market[it]++; return;   // the market keeps the stock for resale
  }
}
function shopBuy(S,v){
  const it=v.shopItem;
  if(it&&S.market[it]>0&&v.coins>=BASE[it]&&v.inv[it]<12){S.market[it]--;v.coins-=BASE[it];v.inv[it]++;}
}
function eatBest(S,v){
  for(const [k,restore] of FOOD) if(v.inv[k]>0){v.inv[k]--;v.need.hunger=clamp(v.need.hunger-restore,0,100);return true;}
  return false;
}
function findSeller(S,v,item){
  let best=-1,bs=-1e9;
  for(const o of S.v){
    if(o.id===v.id||o.inv[item]<1||o.act==='sleep'||v.feud[o.id]||o.feud[v.id]||v.op[o.id]<-40) continue;
    const sc=v.op[o.id]+S.rng()*20-dist(v.x,v.y,o.x,o.y)/8;
    if(sc>bs){bs=sc;best=o.id;}
  }
  return best;
}

/* ===================== AGENTS: goals & movement ===================== */
function go(S,v,x,y,then,thenT,walkT,seller,item){
  v.act='walk'; v.tx=x; v.ty=y; v.then=then; v.thenT=thenT||0; v.walkT=walkT||400; v.path=route(v.x,v.y,x,y);
  v.buyFrom=seller===undefined?-1:seller; v.buy=v.buyFrom>=0?item:null;
}
// Needs drive the choice: food > sleep > rest > buying inputs > selling surplus > company > work > home.
function chooseGoal(S,v){
  const R=S.rng, m=minuteOf(S.tick), n=v.need, home=[v.hx,v.hy+4];
  if(n.hunger>50&&eatBest(S,v)) return;
  if(isNight(m)) return go(S,v,home[0],home[1],'sleep',999);
  if(n.hunger>55){
    for(const it of ['meal','bread','fish']){
      if(v.coins<BASE[it]) continue;
      const s=findSeller(S,v,it);
      if(s>=0){const o=S.v[s];return go(S,v,o.x,o.y,'idle',0,300,s,it);}
    }
    const mi=['meal','bread','fish','grain'].find(it=>S.market[it]>0&&v.coins>=BASE[it]);
    if(mi){v.shopItem=mi;return go(S,v,HUB.market[0]+R()*8-4,HUB.market[1]+R()*8-4,'shop',8,300);}
  }
  if(n.fatigue>70) return go(S,v,home[0],home[1],'rest',80,400);
  const need=v.job==='baker'&&v.inv.grain<4?'grain':v.job==='innkeeper'?(v.inv.grain<2?'grain':v.inv.fish<1?'fish':null):null;
  if(need&&S.market[need]>1&&v.coins>=BASE[need]){v.shopItem=need;return go(S,v,HUB.market[0]+R()*8-4,HUB.market[1]+R()*8-4,'shop',24,300);}
  if(need&&v.coins>=BASE[need]){const s=findSeller(S,v,need);if(s>=0){const o=S.v[s];return go(S,v,o.x,o.y,'idle',0,300,s,need);}}
  for(const it of ['grain','fish','bread','meal']) if(v.inv[it]>SURPLUS[it])
    return go(S,v,HUB.market[0]+R()*8-4,HUB.market[1]+R()*8-4,'sell',40,300);
  const win=m>=360&&m<450?'dawn':m>=780&&m<900?'afternoon':m>=1080&&m<1290?'evening':null;
  if(win){
    let rec=v.past[win]; if(!rec||rec.day!==S.day) rec=v.past[win]={day:S.day,n:0};
    const opts=win==='evening'?v.routine.evening:[v.routine[win]];
    if(rec.n<opts.length){const k=opts[rec.n++]; if(R()<0.8){const p=PASTIMES[k].at(v,R);v.pastime=k;return go(S,v,p[0],p[1],'pastime',PASTIMES[k].dur,400);}}
  }
  if(n.social>55){const h=choose(R,HUBS);return go(S,v,h[0]+R()*16-8,h[1]+R()*12-6,'socialize',50,300);}
  if(isWorkHours(m)) return go(S,v,v.work[0],v.work[1],'work',160,300);
  return go(S,v,home[0],home[1],'idle',30,200);
}
function moveTo(v){
  const wp=v.path&&v.path.length?v.path[0]:null, gx=wp?wp[0]:v.tx, gy=wp?wp[1]:v.ty;
  const dx=gx-v.x, dy=gy-v.y, d=Math.hypot(dx,dy);
  if(d<=v.speed){v.x=gx;v.y=gy;if(wp){v.path.shift();return false;}return true;}
  v.x+=dx/d*v.speed; v.y+=dy/d*v.speed; v.walk+=0.7;
  if(Math.abs(dx)>0.3) v.dir=dx>0?1:-1;
  return false;
}
function updateNeeds(v){
  const n=v.need, sl=v.act==='sleep';
  n.hunger=clamp(n.hunger+(sl?0.03:0.07),0,100);
  n.social=clamp(n.social+(sl?0:0.04),0,100);
  if(sl) n.fatigue=clamp(n.fatigue-0.25,0,100);
  else if(v.act==='rest'||(v.act==='pastime'&&v.pastime==='nap')) n.fatigue=clamp(n.fatigue-0.12,0,100);
  else n.fatigue=clamp(n.fatigue+0.05,0,100);
}
function finishAct(S,v){
  if(v.act==='work'&&v.sess>0) emit(S,'work',v.id,-1,{job:v.job,qty:v.sess});
  if(v.act==='pastime'&&v.pastime){                       // log it with whoever shared it; shared time warms people
    const P=PASTIMES[v.pastime], w=P.solo?[]:S.v.filter(o=>o!==v&&o.act==='pastime'&&o.pastime===v.pastime&&dist(o.x,o.y,v.x,v.y)<26).map(o=>o.id);
    const ev=emit(S,'pastime',v.id,-1,{kind:v.pastime,with:w}); remember(S,v.id,ev,0.3,'did');
    for(const o of w) shift(S,v.id,o,1);
    v.need.social=clamp(v.need.social-(P.solo?0:6+8*w.length),0,100);
  }
  v.pastime=null;
  v.sess=0; v.act='idle'; v.actT=0;
}
function dailyUpkeep(S){
  for(const v of S.v){
    v.coins+=WAGE;                                   // village purse pays a daily wage for chores
    for(const m of v.mem) m.w*=(m.role==='did'||m.role==='target')?0.96:0.9;   // weak memories fade
    v.mem=v.mem.filter(m=>m.w>0.06);
    if(v.traits.includes('forgiving')) v.op=v.op.map(o=>o<0?Math.min(0,o+0.5):o);   // forgiving people let grudges cool a little
    for(const k in v.bel){v.bel[k].p*=0.97;if(v.bel[k].p<0.06)delete v.bel[k];}
  }
  const held=new Set();                                // forget rumors nobody holds any more
  for(const v of S.v) for(const k in v.bel) held.add(+k);
  for(const k in S.rumors) if(!held.has(+k)) delete S.rumors[k];
}

/* ===================== SIM STEP (fixed timestep: one call = one tick) ===================== */
function step(S){
  S.tick++;
  const m=minuteOf(S.tick), night=isNight(m), dy=dayOf(S.tick);
  if(dy!==S.day){S.day=dy;dailyUpkeep(S);}
  for(const v of S.v){
    updateNeeds(v);
    if(v.iconT>0) v.iconT--;
    if(v.act==='talk'){
      if(--v.actT<=0){const p=S.v[v.partner]; if(v.id<p.id) resolveTalk(S,v,p); v.partner=-1;
        const r=v.resume; v.resume=null;
        if(r&&r.walk){v.pastime=r.pastime;go(S,v,r.tx,r.ty,r.then,r.thenT,400);}
        else if(r){v.act=r.act;v.actT=r.actT;v.pastime=r.pastime;}
        else v.act='idle';}
      continue;
    }
    if(v.act==='walk'){
      if(v.buyFrom>=0){
        const s=S.v[v.buyFrom];
        if(s.act==='sleep'){v.buyFrom=-1;v.buy=null;v.act='idle';continue;}
        v.tx=s.x; v.ty=s.y;
        if(dist(v.x,v.y,s.x,s.y)>10) moveTo(v);      // stand close; pairing() starts the trade talk
      } else if(moveTo(v)){v.act=v.then;v.actT=v.thenT;}
      if(--v.walkT<=0){v.act='idle';v.buyFrom=-1;v.buy=null;}
      continue;
    }
    if(v.act==='idle'){v.buyFrom=-1;v.buy=null;chooseGoal(S,v);continue;}
    if(v.act==='work') produce(S,v);
    else if(v.act==='sell'&&S.tick%6===0) sellSurplus(S,v);
    else if(v.act==='shop'&&S.tick%3===0) shopBuy(S,v);
    v.actT--;
    const stop=v.actT<=0||(v.act==='sleep'&&!night)||((v.act==='work'||v.act==='socialize')&&(v.need.hunger>70||v.need.fatigue>85))||(v.act==='work'&&(night||m>=1080||m===780))||(v.act==='pastime'&&(night||v.need.hunger>75));
    if(stop) finishAct(S,v);
  }
  pairing(S);
}

/* ===================== DIARIES & DESCRIPTIONS (built only from log + memories) ===================== */
function rumorClaim(S,d){
  const sv=d.sev>0.75?(d.kind==='kind'?'warmly ':'viciously '):d.sev<0.3?'slightly ':'';
  return `${S.v[d.doer].name} ${sv}${KIND[d.kind]} ${S.v[d.target].name}`+(d.det&&d.det.length?`, ${d.det.join(', ')}`:'');
}
function sentence(S,v,ev,role){
  const N=i=>S.v[i].name, d=ev.d, has=t=>v.traits.includes(t);
  switch(ev.type){
    case 'trade':
      if(d.fair) return role==='did'?(ev.id%2?`I sold ${ITEM[d.item]} to ${N(ev.b)} for ${d.price}.`:`${N(ev.b)} paid me ${d.price} for ${ITEM[d.item]} at ${ev.place}.`)
        :(ev.id%2?`I bought ${ITEM[d.item]} from ${N(ev.a)} for ${d.price}.`:`At ${ev.place} I paid ${N(ev.a)} ${d.price} for ${ITEM[d.item]}.`);
      if(role==='did') return `I charged ${N(ev.b)} ${d.price} for ${ITEM[d.item]} worth ${d.base}.`+(has('greedy')?' They should be grateful.':'');
      if(role==='target') return `${N(ev.a)} charged me ${d.price} for ${ITEM[d.item]}, which is worth ${d.base}.`+(has('forgiving')?' I will try to let it go.':has('proud')?' I will not forget that.':'');
      return `I saw ${N(ev.a)} overcharge ${N(ev.b)}.`;
    case 'gift':
      return role==='did'?`I gave ${N(ev.b)} ${ITEM[d.item]} when they had none.`:`${N(ev.a)} gave me ${ITEM[d.item]} when I was hungry.`;
    case 'insult':
      if(role==='did') return `I insulted ${N(ev.b)}.`;
      if(role==='target') return `${N(ev.a)} insulted me.`+(has('proud')?' I will not let it stand.':has('forgiving')?' I try not to dwell on it.':'');
      return `I saw ${N(ev.a)} insult ${N(ev.b)}.`;
    case 'apology':
      if(role==='did') return d.accepted?`I apologized to ${N(ev.b)}, and they accepted.`:`I apologized to ${N(ev.b)}, but they would not hear it.`;
      return d.accepted?`${N(ev.a)} apologized, and I accepted.`:`${N(ev.a)} apologized, and I turned them away.`;
    case 'pastime':{const P=PASTIMES[d.kind], w=(d.with||[]).filter(i=>i!==v.id).map(N);
      return P.diary[ev.id%P.diary.length]+(w.length?` with ${listNames(w)}`:'')+'.';}
    case 'feud': return `I stopped speaking to ${N(ev.b)}.`;
    case 'reconcile': return `I made peace with ${N(ev.b)}.`;
    case 'rumor':
      if(role==='told') return `I told ${N(ev.b)} that ${rumorClaim(S,d)}.`;
      if(role==='heard') return `Hearsay from ${N(ev.a)}, who said ${rumorClaim(S,d)}.`+(d.believed?(has('gossipy')?' I believe it, and I will pass it on.':' I believe it.'):" I don't believe a word of it.");
      return null;
    default: return null;
  }
}
function diaryFor(S,i,day){
  const v=S.v[i], out=[];
  const items=v.mem.map(m=>({m,ev:S.log[m.ev]})).filter(x=>x.ev.day===day).sort((x,y)=>x.ev.t-y.ev.t);
  for(const {m,ev} of items){const s=sentence(S,v,ev,m.role);if(s)out.push(s);}
  const made=S.log.reduce((n,e)=>n+(e.type==='work'&&e.a===i&&e.day===day?e.d.qty:0),0);
  const what={farmer:['harvested','wheat'],baker:['rolled','rotis'],fisher:['caught','fish'],innkeeper:['served','thalis']}[v.job];
  if(made) out.push(`I ${what[0]} ${made} ${what[1]}.`);
  if(!out.length) return null;
  if(mood(v)<35) out.push('I am worn out.');
  return out.join(' ');
}
function reasonFor(S,v,j){
  let best=null;
  for(const m of v.mem){
    const ev=S.log[m.ev];
    if(ev.a!==j&&ev.b!==j) continue;
    if(!best||m.w>=best.m.w) best={m,ev};
  }
  if(!best) return v.lastTalk[j]!==undefined?`chatted on day ${dayOf(v.lastTalk[j])}`:'barely know each other';
  const {m,ev}=best, t=({
    trade:ev.d.fair?'traded fairly':(m.role==='target'?'overcharged me':'overcharged them'),
    gift:m.role==='target'?'gave me food':'gave food',
    insult:m.role==='target'?'insulted me':m.role==='did'?'insulted them':'insulted someone',
    apology:ev.d.accepted?'made peace':'apology refused',
    feud:'a feud', reconcile:'made peace',
    rumor:m.role==='heard'?'passed on a rumor':'I passed on gossip'
  })[ev.type]||'shared time';
  return `${t} (day ${ev.day})`;
}
// Observer-side wording for the village feed (the diary above only uses what a villager knows).
function describe(S,ev){
  const N=i=>S.v[i].name, d=ev.d;
  switch(ev.type){
    case 'trade': return d.fair?null:`${N(ev.a)} overcharged ${N(ev.b)}: ₹${d.price} for ${ITEM[d.item]} (worth ${d.base})`;
    case 'gift': return `${N(ev.a)} gave ${ITEM[d.item]} to hungry ${N(ev.b)}`;
    case 'insult': return `${N(ev.a)} insulted ${N(ev.b)}`;
    case 'apology': return `${N(ev.a)} apologized to ${N(ev.b)}: ${d.accepted?'accepted':'refused'}`;
    case 'feud': return `${N(ev.a)} turned against ${N(ev.b)}: a feud begins`;
    case 'reconcile': return `${N(ev.a)} made peace with ${N(ev.b)}`;
    case 'rumor': return `${N(ev.a)} told ${N(ev.b)} (v${d.v}${d.mut.length?', '+d.mut.join('/'):''}, ${d.believed?'believed':'doubted'}): ${rumorClaim(S,d)}`;
    default: return null;
  }
}
function activityText(S,v){
  switch(v.act){
    case 'talk': return `talking with ${S.v[v.partner].name}`;
    case 'walk':
      if(v.buyFrom>=0) return `going to buy ${ITEM[v.buy]} from ${S.v[v.buyFrom].name}`;
      return v.then==='sleep'?'heading home for the night':v.then==='work'?'walking to work':
        v.then==='sell'?'carrying surplus to the bazaar':v.then==='socialize'?'walking over to chat':
        v.then==='rest'?'going home to rest':v.then==='pastime'&&v.pastime?`heading out: ${PASTIMES[v.pastime].label}`:'on the way somewhere';
    case 'work': return `working (${v.job==='farmer'?'the fields':v.job==='baker'?'the chakki':v.job==='fisher'?'the pond':'the chai house'})`;
    case 'pastime': return PASTIMES[v.pastime]?PASTIMES[v.pastime].label:'passing the time';
    case 'socialize': return 'chatting around the village';
    case 'sell': return 'selling surplus at the bazaar';
    case 'shop': return 'shopping at the bazaar';
    case 'rest': return 'resting at home';
    case 'sleep': return 'asleep';
    default: return 'pausing';
  }
}

  const d=v.dir>0?1:-1;
  g.lineWidth=0.9;
  if(v.job==='farmer'){g.strokeStyle=C.wood;line(x+3*d,by-3,x+4.5*d,by+3);g.fillStyle=C.stone;g.fillRect(x+3*d-(d<0?2:0),by-4,2.5,1.2);}
  else if(v.job==='baker'){g.fillStyle=C.stoneDk;rr(x+2.5*d-(d<0?4:0),by-4.5,4,1.4,0.7);g.fillStyle=C.wheat;ell(x+4.5*d,by-5.4,1.6,1);}
  else if(v.job==='fisher'){g.strokeStyle=C.wood;line(x-2*d,by-6,x+6*d,by-14);g.strokeStyle=C.paper;g.lineWidth=0.5;line(x+6*d,by-14,x+6*d,by-5);}
  else {g.fillStyle=C.wood;rr(x+2.5*d-(d<0?3:0),by-4,3,3.5,1);g.fillStyle=C.paper;g.fillRect(x+2.5*d-(d<0?3:0),by-4.6,3,1);}
}
function pastimeProp(v,x,by,now){                        // each pastime has its own prop or pose
  const d=v.dir>0?1:-1, k=v.pastime;
  if(k==='water'){g.fillStyle=C.trunk;ell(x,by-14,2.6,2);g.fillStyle=C.roofDk;g.fillRect(x-1,by-16.4,2,1);}           // matka on the head
  else if(k==='yoga'){g.strokeStyle=v.skin;g.lineWidth=0.9;line(x-2,by-6,x-3.5,by-13);line(x+2,by-6,x+3.5,by-13);}       // arms raised
  else if(k==='prayer'||k==='aarti'){g.fillStyle=C.saffron;ell(x+2.5*d,by-4,1.4,0.8);glow(x+2.5*d,by-5.2,3,0.6+0.3*Math.sin(now/120));g.fillStyle=C.marigold;circ(x+2.5*d,by-5.4,0.6);}
  else if(k==='chai'){g.fillStyle=C.paper;rr(x+2.5*d-(d<0?2:0),by-4.5,2,2.5,0.6);g.fillStyle='rgba(255,255,255,0.5)';circ(x+3*d,by-6.5-(now/400)%2,0.6);}
  else if(k==='cards'){g.fillStyle=C.paper;g.fillRect(x+2*d-(d<0?3:0),by-5,3,2);g.fillStyle=C.red;g.fillRect(x+2*d-(d<0?3:0)+1,by-4.6,1,1);}
  else if(k==='washing'){g.fillStyle=C.cloth2;rr(x+2*d-(d<0?5:0),by+1,5,1.6,0.8);g.fillStyle='rgba(255,255,255,0.7)';circ(x+5*d,by+1.5+Math.sin(now/150)*0.5,0.6);}
  else if(k==='rangoli'){for(let i=0;i<5;i++){g.fillStyle=[C.lotus,C.marigold,C.cloth2,C.paper,C.red][i];circ(x+3*d+Math.cos(i*1.26)*2,by+2+Math.sin(i*1.26)*1,0.6);}}
  else if(k==='bazaar'){g.fillStyle=C.wood;rr(x+2.5*d-(d<0?3:0),by-4,3,2.5,1);}
}
function lyingPose(v,x,y,now){
  g.fillStyle=v.cloth; rr(x-5,y-4,10,4,2);
  g.fillStyle=v.skin; circ(x-6,y-3.5,2.3);
  g.fillStyle=v.hair; g.beginPath(); g.arc(x-6,y-3.5,2.5,Math.PI*0.6,Math.PI*1.5); g.fill();
  g.fillStyle=C.paper; g.font='5px Georgia'; g.globalAlpha=0.85; g.fillText('z',x+3,y-7-(now/700)%3); g.globalAlpha=1;
}
function drawVillager(v,now){
  const x=Math.round(v.rx), y=Math.round(v.ry);
  if(v.id===sel){g.strokeStyle=C.gold;g.lineWidth=1;g.globalAlpha=0.7+0.3*Math.sin(now/220);g.beginPath();g.ellipse(x,y+1,7+Math.sin(now/220)*0.7,3,0,0,Math.PI*2);g.stroke();g.globalAlpha=1;}
  else if(v.id===hover){g.strokeStyle='rgba(255,246,227,0.7)';g.lineWidth=1;g.beginPath();g.ellipse(x,y+1,6.5,2.7,0,0,Math.PI*2);g.stroke();}
  g.fillStyle=C.shade; ell(x+1.5,y+0.5,3.2,1.2);
  if(v.act==='sleep'||(v.act==='pastime'&&v.pastime==='nap')) return lyingPose(v,x,y,now);
  const walking=v.act==='walk', sitting=v.act==='pastime'&&(v.pastime==='chai'||v.pastime==='cards'||v.pastime==='banyan');
  const bob=walking?Math.abs(Math.sin(v.walk))*0.8:0, sw=walking?Math.sin(v.walk)*1.2:0, by=y-bob+(sitting?1.5:0);
  g.strokeStyle=C.legs; g.lineWidth=1.2;
  if(sitting){line(x-1,by,x+1.5*v.dir,by+0.6);line(x+1,by,x+3*v.dir,by+0.6);}
  else {line(x-1,y,x-1-sw,y+2); line(x+1,y,x+1+sw,y+2);}
  g.fillStyle=v.cloth; rr(x-2.6,by-7,5.2,6.5,2);
  g.fillStyle=C.marigold; g.fillRect(x-2.6,by-4.2,5.2,0.9);                     // embroidered border
  g.fillStyle=v.skin; circ(x,by-9.5,2.4);
  g.fillStyle=v.hair; g.beginPath(); g.arc(x,by-9.5,2.6,Math.PI*1.05,Math.PI*1.95); g.fill();
  if(v.hat){g.fillStyle=[C.saffron,C.lotus,C.cloth2,C.marigold][v.id%4];rr(x-3.1,by-13.1,6.2,3.4,1.7);g.fillRect(x-v.dir*3.4-0.5,by-11.2,1.2,2.2);}   // turban
  else{g.fillStyle=C.red;g.fillRect(x+(v.dir>0?0.5:-1.1),by-10.9,0.7,0.7);}       // bindi
  g.fillStyle=C.ink; g.fillRect(x+(v.dir>0?0.6:-1.2),by-9.8,0.6,0.7);
  if(v.act==='pastime') pastimeProp(v,x,by,now); else jobProp(v,x,by);
}
function star(cx,cy,r1,r2,n){g.beginPath();for(let i=0;i<n*2;i++){const r=i%2?r2:r1,a=i*Math.PI/n-Math.PI/2;g.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);}g.closePath();g.fill();}
function drawIcon(v){                                      // mood icon built from shapes, shown during real events
  const t=40-v.iconT, cx=Math.round(v.rx), cy=Math.round(v.ry-(v.act==='talk'?25:20)-t*0.06), k=v.icon;
  const sc=t<6?t/6:1;                                      // pop-in
  g.save(); g.translate(cx,cy); g.scale(sc,sc);
  g.fillStyle=C.bubble; circ(0,0,4.2);
  if(k==='heart'){g.fillStyle=C.heart;circ(-1.2,-0.6,1.4);circ(1.2,-0.6,1.4);tri(-2.5,-0.2,2.5,-0.2,0,2.6);}
  else if(k==='angry'){g.fillStyle=C.red;star(0,0,3,1.4,5);}
  else if(k==='coin'){g.fillStyle=C.gold;circ(0,0,2.5);g.fillStyle=C.wheatDk;circ(0,0,1.2);}
  else if(k==='excl'){g.fillStyle=C.wheatDk;g.fillRect(-0.6,-2.5,1.2,3);circ(0,1.7,0.7);}
  g.restore();
}
function drawBubble(v,now){
  const cx=Math.round(v.rx), cy=Math.round(v.ry-17);
  g.fillStyle=C.bubble; rr(cx-6,cy-3.5,12,7,3.5); tri(cx-1.5,cy+3,cx+1.5,cy+3,cx,cy+5);
  const ph=Math.floor(now/260)%3;
  for(let i=0;i<3;i++){g.fillStyle=i<=ph?C.ink:C.stoneDk;circ(cx-3+i*3,cy,0.8);}
}

/* ===================== RENDER: light & ambient effects ===================== */
function nightAmount(m){                                    // 0 = day .. 1 = deep night, smooth ramps at dusk and dawn
  if(m>=1140&&m<1320) return (m-1140)/180;
  if(m>=1320||m<300) return 1;
  if(m<420) return 1-(m-300)/120;
  return 0;
}
function drawWater(now){                                    // shimmering highlights on the pond
  g.strokeStyle=C.waterLt; g.lineWidth=0.8;
  for(let i=0;i<5;i++){
    const x=POND.x-15+i*7+Math.sin(now/900+i*1.7)*2.5, y=POND.y-4+(i%2)*6+Math.sin(now/1300+i)*0.6;
    g.globalAlpha=0.35+0.3*Math.sin(now/600+i*2); line(x,y,x+3.5,y);
  }
  g.globalAlpha=1;
}
const CLOUDS=[[0,60,1],[190,190,1.3],[340,120,0.85]];
function drawClouds(ft,n){                                  // soft cloud shadows drifting over the village
  if(n>=1) return;
  g.fillStyle=`rgba(40,28,15,${0.07*(1-n)})`;
  for(const [off,y,s] of CLOUDS){
    const x=((ft*0.1*s+off)%(W+200))-100;
    ell(x,y,30*s,11*s); ell(x+20*s,y+4*s,22*s,9*s); ell(x-20*s,y+3*s,18*s,8*s);
  }
}
function effectsUpdate(dt){
  const k=dt/16.7, m=minuteOf(S.tick);
  if(!paused){
    S.v.forEach((v,i)=>{                                   // smoke while someone is home and awake
      const home=dist(v.x,v.y,v.hx,v.hy+4)<14&&v.act!=='sleep';
      if(home&&CHIMNEYS[i]&&Math.random()<0.035*k*Math.min(speed,3)) smoke.push(newPuff(CHIMNEYS[i]));
    });
    if(tavernChimney&&m>=360&&m<1290&&Math.random()<0.05*k*Math.min(speed,3)) smoke.push(newPuff(tavernChimney));
    for(const p of smoke){p.x+=p.vx*k;p.y+=p.vy*k;p.r+=0.022*k;p.life+=k;}
    smoke=smoke.filter(p=>p.life<p.max).slice(-160);
  }
  for(const r of ripples){r.r+=0.35*k;r.life-=k;}
  ripples=ripples.filter(r=>r.life>0);
  for(const t of trails) t.life-=k;
  trails=trails.filter(t=>t.life>0);
}
function newPuff([x,y]){return {x:x+Math.random()-0.5,y,r:0.8,life:0,max:110+Math.random()*70,vx:0.03+Math.random()*0.05,vy:-0.1-Math.random()*0.06};}
function drawSmoke(){
  for(const p of smoke){g.globalAlpha=(1-p.life/p.max)*0.42;g.fillStyle='#efe6d6';circ(p.x,p.y,p.r);}
  g.globalAlpha=1;
}
function drawLight(m,now){
  const n=nightAmount(m);
  if(m>=1020&&m<1200){g.globalAlpha=(m-1020)/180*0.14;g.fillStyle='#e8a05a';g.fillRect(0,0,W,H);g.globalAlpha=1;}   // warm dusk
  if(m>=330&&m<450){g.globalAlpha=0.08*(1-Math.abs(m-390)/60);g.fillStyle='#f2a6b0';g.fillRect(0,0,W,H);g.globalAlpha=1;} // pink dawn
  if(n<=0) return;
  g.globalAlpha=n*0.55; g.fillStyle=C.night; g.fillRect(0,0,W,H); g.globalAlpha=1;
  g.globalCompositeOperation='lighter';
  for(const p of WINDOWS) glow(p[0],p[1],7,n*0.85);
  LANTERNS.forEach((p,i)=>glow(p[0],p[1],27+Math.sin(now/170+i*1.7)*1.8,n*(0.45+0.08*Math.sin(now/90+i))));   // flickering diyas
  if(n>0.3) for(const f of flies){                           // fireflies
    const x=f.x+Math.sin(now/1700*f.s+f.p)*7, y=f.y+Math.cos(now/2100*f.s+f.p)*4;
    const a=(0.5+0.5*Math.sin(now/380*f.s+f.p))*(n-0.3)/0.7;
    glow(x,y,3.2,a*0.9,'210,255,140');
  }
  g.globalCompositeOperation='source-over';
}
function drawRipples(){
  for(const r of ripples){g.strokeStyle=r.col;g.lineWidth=1;g.globalAlpha=Math.max(0,r.life/45)*0.9;g.beginPath();g.ellipse(r.x,r.y,r.r,r.r*0.45,0,0,Math.PI*2);g.stroke();}
  g.globalAlpha=1;
}
function drawFrame(now){
  const m=minuteOf(S.tick);
  g.drawImage(stat,0,0);
  drawWater(now);
  g.setLineDash([2,2]); g.lineWidth=1;                       // rumor trails between teller and listener
  for(const t of trails){g.globalAlpha=t.life/70*0.9;g.strokeStyle=C.paper;line(t.x1,t.y1-5,t.x2,t.y2-5);}
  g.setLineDash([]); g.globalAlpha=1;
  drawRipples();
  for(const v of S.v.slice().sort((a,b)=>a.ry-b.ry)) drawVillager(v,now);   // y-sort
  drawSmoke();
  drawClouds(S.tick+alpha,nightAmount(m));
  drawLight(m,now);
  for(const v of S.v){if(v.act==='talk')drawBubble(v,now);if(v.iconT>0&&v.icon)drawIcon(v);}
  g.drawImage(vign,0,0);
}

/* ===================== UI: header, labels, chips ===================== */
const hhmm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const period=m=>m<300?'night':m<420?'dawn':m<720?'morning':m<1020?'afternoon':m<1200?'evening':'night';
const ACT_SHORT={walk:'walking',work:'working',talk:'talking',sleep:'asleep',socialize:'chatting',sell:'selling',shop:'shopping',rest:'resting',idle:''};
const ACT_COLOR={work:'#d9902f',talk:'#c4607a',socialize:'#c4607a',sleep:'#5f8fb5',rest:'#5f8fb5',pastime:'#8a6fc0',walk:'#6f9a52'};
function buildLabels(){
  labelsEl.innerHTML=''; chipsEl.innerHTML='';
  for(const v of S.v){
    const s=document.createElement('span'); labelsEl.appendChild(s);
    const b=document.createElement('button'); b.dataset.id=v.id;
    b.innerHTML=`<span class="av" style="background:${v.cloth}">${esc(v.name[0])}</span>${esc(v.name)} <small>${JOBNAME[v.job]}</small>`;
    b.onclick=()=>openPanel(v.id); chipsEl.appendChild(b);
  }
}
function updateLabels(){
  const placed=[];                                          // stack labels that would overlap (front-most first)
  S.v.slice().sort((a,b)=>b.ry-a.ry).forEach(v=>{
    const lying=v.act==='sleep'||(v.act==='pastime'&&v.pastime==='nap');
    let ly=v.ry-(lying?8:17);
    for(let k=0;k<6;k++){const hit=placed.find(p=>Math.abs(p[0]-v.rx)<24&&Math.abs(p[1]-ly)<7);if(!hit)break;ly=hit[1]-7.5;}
    placed.push([v.rx,ly]); v.ly=ly;
  });
  S.v.forEach((v,i)=>{
    const s=labelsEl.children[i], focus=v.id===sel||v.id===hover;
    s.style.left=(v.rx/W*100)+'%'; s.style.top=(v.ly/H*100)+'%';
    s.className=(v.id===sel?'sel ':'')+(showNames||focus?'':'hide');
    const sub=focus?activityText(S,v):(v.act==='pastime'?PASTIMES[v.pastime].short:'');
    const key=v.name+'|'+sub;
    if(s.dataset.k!==key){s.dataset.k=key;s.innerHTML=esc(v.name)+(sub?`<small>${esc(sub)}</small>`:'');}
  });
  for(const b of chipsEl.children){b.classList.toggle('sel',+b.dataset.id===sel);b.title=activityText(S,S.v[+b.dataset.id]);}
}
function updateHud(){
  const m=minuteOf(S.tick);
  $('clock').innerHTML=`Day ${S.day} · ${hhmm(m)} <span>${period(m)}${paused?' · paused':''}</span>`;
  $('sun').style.left=(m/1440*100)+'%';
  $('sun').style.background=nightAmount(m)>0.5?'#dfe6ff':'#fff6cf';
  $('pill').style.display=paused?'block':'none';
}
function updateStats(){
  const avg=S.v.reduce((n,v)=>n+mood(v),0)/S.v.length;
  $('stMood').textContent=Math.round(avg)+'%';
  $('stFeud').textContent=S.v.reduce((n,v)=>n+v.feud.filter(Boolean).length,0);
  $('stRumor').textContent=Object.keys(S.rumors).length;
  $('stTrade').textContent=tradesByDay[S.day]||0;
}

/* ===================== UI: villager panel ===================== */
const WELCOME=`<div class="welcome"><h2>Welcome to Chhota Gaon</h2>
  Twelve villagers farm, cook, fish, gossip and pray here. Nothing is scripted: every quarrel, kindness and rumor comes from the simulation.
  <ul><li>Click a villager, or a name below the map, to see how they feel and read their diary.</li>
  <li>Follow the <b>village feed</b> and click an entry to jump to the people involved.</li>
  <li>Dotted lines show a rumor passing from one person to another.</li></ul></div>`;
function openPanel(id){
  const changed=id!==sel; sel=id; if(changed){tab=tab||'overview';panel.classList.remove('pop');void panel.offsetWidth;panel.classList.add('pop');}
  renderPanel();
  if(window.innerWidth<=900) panel.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function closePanel(){sel=-1;renderPanel();}
function meter(l,val,c){val=clamp(val,0,100);return `<div class="meter"><span>${l}</span><div class="bar"><i style="width:${val.toFixed(0)}%;background:${c}"></i></div><em>${val.toFixed(0)}</em></div>`;}
function renderPanel(){
  if(sel<0){panel.innerHTML=WELCOME;return;}
  const v=S.v[sel], p=mood(v), old=panel.querySelector('.tb'), keep=old&&old.dataset.k===sel+tab?old.scrollTop:0;
  let body='';
  if(tab==='overview'){
    const mems=v.mem.map(m=>({m,ev:S.log[m.ev]})).sort((a,b)=>b.ev.t-a.ev.t).map(({m,ev})=>({ev,s:sentence(S,v,ev,m.role)})).filter(x=>x.s).slice(0,6)
      .map(({ev,s})=>`<div class="mem"><small>Day ${ev.day} · ${hhmm(ev.m)} · ${esc(ev.place)}</small>${esc(s)}</div>`).join('');
    const r=v.routine, lab=k=>PASTIMES[k].short;
    body=`<div class="act"><span class="dot" style="background:${ACT_COLOR[v.act]||'#b89c66'}"></span>${esc(activityText(S,v))}</div>
      ${meter('Fullness',100-v.need.hunger,'#d9902f')}${meter('Energy',100-v.need.fatigue,'#5f8fb5')}${meter('Company',100-v.need.social,'#c4607a')}${meter('Mood',p,'#6f9a52')}
      <div class="inv"><span>₹ ${v.coins}</span>${Object.entries(v.inv).map(([k,n])=>`<span>${ITEM[k]} ${n}</span>`).join('')}</div>
      <div class="routine"><b>Routine:</b> dawn ${lab(r.dawn)} · afternoon ${lab(r.afternoon)} · evening ${r.evening.map(lab).join(' & ')}</div>
      <h4>Recent memories</h4>${mems||'<div class="hint">Nothing memorable yet.</div>'}`;
  } else if(tab==='feelings'){
    body=S.v.filter(o=>o.id!==v.id).sort((a,b)=>v.op[b.id]-v.op[a.id]).map(o=>{
      const s=v.op[o.id], w=Math.min(50,Math.abs(s)/2), col=s>=0?'#6f9a52':'#c2453a', st=s>=0?`left:50%;width:${w}%`:`right:50%;width:${w}%`;
      return `<div class="feel" data-open="${o.id}" title="Open ${esc(o.name)}"><span class="nm">${esc(o.name)}</span><div class="fbar"><i style="${st};background:${col}"></i></div>
        <span class="why">${Math.round(s)} · ${feelWord(s)}${v.feud[o.id]?'<span class="badge">feud</span>':''} · ${esc(reasonFor(S,v,o.id))}</span></div>`;}).join('');
  } else {
    for(let d=S.day;d>=1;d--){const t=diaryFor(S,v.id,d);if(t)body+=`<div class="entry"><b>Day ${d}</b>${esc(t)}</div>`;}
    body=body||'<div class="hint">No entries yet. Diaries fill in as the day brings events.</div>';
  }
  panel.innerHTML=`<div class="ph"><span class="av" style="background:${v.cloth}">${esc(v.name[0])}</span>
      <div><h2>${esc(v.name)}</h2><div class="sub">${JOBNAME[v.job]} · feeling ${moodWord(p)}</div><div>${v.traits.map(t=>`<span class="chipt">${t}</span>`).join('')}</div></div>
      <button class="x" data-close title="Close (Esc)">×</button></div>
    <div class="tabs">${['overview','feelings','diary'].map(t=>`<button data-tab="${t}" class="${t===tab?'on':''}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>
    <div class="tb" data-k="${sel+tab}">${body}</div>`;
  panel.querySelector('.tb').scrollTop=keep;
}
panel.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-close],[data-open]'); if(!t) return;
  if(t.dataset.tab){tab=t.dataset.tab;renderPanel();}
  else if(t.hasAttribute('data-close')) closePanel();
  else openPanel(+t.dataset.open);
});

/* ===================== UI: event feed ===================== */
const catOf=ev=>ev.type==='rumor'?'rumor':(ev.type==='gift'||ev.type==='reconcile'||(ev.type==='apology'&&ev.d.accepted))?'kind':'conflict';
const RIPPLE={rumor:'#9fd0e8',kind:'#f2a6c0',conflict:'#f07a6a'};
function feedUpdate(){
  for(;lastEv<S.log.length;lastEv++){
    const ev=S.log[lastEv];
    if(ev.type==='trade') tradesByDay[ev.day]=(tradesByDay[ev.day]||0)+1;
    if(ev.type==='rumor') trails.push({x1:ev.d.ax,y1:ev.d.ay,x2:ev.d.bx,y2:ev.d.by,life:70});
    const txt=describe(S,ev); if(!txt) continue;
    const c=catOf(ev), a=S.v[ev.a];
    if(ev.type!=='rumor') ripples.push({x:a.x,y:a.y,r:2,life:45,col:RIPPLE[c]});
    const empty=feedEl.querySelector('.empty'); if(empty) empty.remove();
    const d=document.createElement('div'); d.className='c-'+c; d.dataset.a=ev.a;
    d.innerHTML=`<span class="t">Day ${ev.day} · ${hhmm(ev.m)} · ${esc(ev.place)}</span>${esc(txt)}`;
    feedEl.insertBefore(d,feedEl.firstChild);
    while(feedEl.children.length>100) feedEl.removeChild(feedEl.lastChild);
  }
}
feedEl.addEventListener('click',e=>{
  const d=e.target.closest('[data-a]'); if(!d) return;
  const v=S.v[+d.dataset.a]; ripples.push({x:v.rx,y:v.ry,r:2,life:45,col:'#f2b632'}); openPanel(v.id);
});
document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{
  feedEl.dataset.f=b.dataset.f; document.querySelectorAll('.filters button').forEach(x=>x.classList.toggle('on',x===b));
});

/* ===================== MAIN LOOP (fixed-timestep sim, interpolated drawing) ===================== */
const TICK_MS=100;                                            // 10 sim ticks per second at 1x
let last=performance.now(), acc=0, uiT=0;
function reset(seed){
  seed=String(seed||'emberfall').trim()||'emberfall';
  S=createSim(seed); stat=buildStatic(seed); vign=vign||buildVignette();
  const hp=new URLSearchParams(location.hash.slice(1)), skip=+(hp.get('skip')||0);   // also #sel=3&tab=diary   // e.g. #skip=1500 fast-forwards (handy for screenshots)
  for(let i=0;i<skip;i++) step(S);
  for(const v of S.v){v.px=v.rx=v.x;v.py=v.ry=v.y;}
  lastEv=0; trails=[]; ripples=[]; smoke=[]; tradesByDay={}; sel=-1; hover=-1; acc=0;
  flies=Array.from({length:26},()=>{const near=[[POND.x,POND.y],BANYAN,TEMPLE,[70,190],[66,116],[440,140],[60,40]][Math.floor(Math.random()*7)];
    return {x:near[0]+Math.random()*50-25,y:near[1]+Math.random()*30-15,s:0.6+Math.random()*0.8,p:Math.random()*6.3};});
  $('seed').value=seed; feedEl.innerHTML='<div class="empty">The village is waking up. Encounters and rumors will appear here.</div>';
  buildLabels(); renderPanel(); updateStats();
  if(hp.get('tab')) tab=hp.get('tab');
  if(hp.get('sel')!==null&&!reset.done) openPanel(+hp.get('sel')); reset.done=true;
}
function frame(now){
  const dt=Math.min(250,now-last); last=now;
  if(!paused){
    acc+=dt*speed; let n=0;
    while(acc>=TICK_MS&&n<100){for(const v of S.v){v.px=v.x;v.py=v.y;} step(S); acc-=TICK_MS; n++;}
    if(n===100) acc=0;
  }
  alpha=clamp(acc/TICK_MS,0,1);
  for(const v of S.v){v.rx=v.px+(v.x-v.px)*alpha; v.ry=v.py+(v.y-v.py)*alpha;}
  feedUpdate(); effectsUpdate(dt);
  drawFrame(now); updateLabels(); updateHud();
  if(now-uiT>500){uiT=now;updateStats();if(sel>=0)renderPanel();}
  requestAnimationFrame(frame);
}

/* ===================== INPUT ===================== */
function villagerAt(e){
  const r=cv.getBoundingClientRect(), mx=(e.clientX-r.left)*W/r.width, my=(e.clientY-r.top)*H/r.height;
  let best=-1,bd=11;
  for(const v of S.v){const d=dist(mx,my,v.rx,v.ry-5);if(d<bd){bd=d;best=v.id;}}
  return best;
}
cv.addEventListener('mousemove',e=>{hover=villagerAt(e);cv.classList.toggle('hand',hover>=0);});
cv.addEventListener('mouseleave',()=>{hover=-1;cv.classList.remove('hand');});
cv.addEventListener('click',e=>{const id=villagerAt(e);if(id>=0)openPanel(id);else closePanel();});
document.addEventListener('mousedown',e=>{
  if(sel>=0&&!e.target.closest('#panel,#view,#chips,header,#feedBox,#stats')) closePanel();
});
function setSpeed(s){speed=s;document.querySelectorAll('[data-sp]').forEach(b=>b.classList.toggle('on',+b.dataset.sp===s));}
function togglePause(){paused=!paused;$('pause').textContent=paused?'▶':'❚❚';}
function toggleNames(){showNames=!showNames;$('names').classList.toggle('on',showNames);}
document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>setSpeed(+b.dataset.sp));
$('pause').onclick=togglePause; $('names').onclick=toggleNames;
$('restart').onclick=()=>reset($('seed').value);
$('random').onclick=()=>reset(Math.random().toString(36).slice(2,8));
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'){reset(e.target.value);e.target.blur();}return;}
  if(e.key===' '){e.preventDefault();togglePause();}
  else if(e.key>='1'&&e.key<='4') setSpeed([1,2,4,8][+e.key-1]);
  else if(e.key==='n'||e.key==='N') toggleNames();
  else if(e.key==='r'||e.key==='R') reset($('seed').value);
  else if(e.key===']') openPanel(sel<0?0:(sel+1)%12);
  else if(e.key==='[') openPanel(sel<0?11:(sel+11)%12);
  else if(e.key==='Escape') closePanel();
});
reset($('seed').value);
requestAnimationFrame(frame);
</script>
</body>
